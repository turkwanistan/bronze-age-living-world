[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bronze-age-living-world"
version = "0.1.0"
description = "Evidence-constrained Bronze Age living-world simulation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bronze-world = "bronze_world.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
